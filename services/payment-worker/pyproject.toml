[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.4,<6.0",
    "redis>=5.0,<6.0",
    "pydantic-settings>=2.0,<3.0",
    "shared",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
