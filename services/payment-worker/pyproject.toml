[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.4,<6.0",
    "redis>=5.0,<6.0",
    "pydantic-settings>=2.0,<3.0",
    "shared",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "httpx>=0.27,<1.0",
    "respx>=0.21,<1.0",
    "fastapi>=0.111,<1.0",
    "sqlalchemy>=2.0,<2.1",
    "fakeredis>=2.20,<3.0",
    "pytest-asyncio>=0.23,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
