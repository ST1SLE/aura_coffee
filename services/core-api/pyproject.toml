[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "core-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg2-binary>=2.9,<3.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "redis>=5.0,<6.0",
    "PyJWT>=2.8,<3.0",
    "cryptography>=46.0.7,<47.0",
    "celery>=5.4,<6.0",
    "bcrypt>=4.0,<5.0",
    "alembic>=1.13,<2.0",
    "httpx>=0.27,<1.0",
    "shared",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "httpx>=0.27",
    "respx>=0.21,<1.0",
    "fakeredis[lua]>=2.21,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
