upstream customer {
    server web-customer:5173;
}

upstream admin {
    server web-admin:5174;
}

upstream api {
    server core-api:8000;
}

server {
    listen 80;
    server_name localhost;

    # API
    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin SPA — redirect bare path to canonical trailing-slash form
    # absolute_redirect off keeps the Location as a path (no host:port rewrite),
    # which is needed because Docker maps external port 8240 to internal port 80.
    location = /admin {
        absolute_redirect off;
        return 301 /admin/;
    }
    location /admin {
        proxy_pass http://admin;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Customer SPA (default)
    location / {
        proxy_pass http://customer;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
