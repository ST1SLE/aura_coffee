               * Поле reason (textarea, 1..500 символов).
               * Валидация: delta != 0, reason непустой.
               * После успеха: refetch user detail, очистить форму,
                 показать snackbar "Баланс изменён".
               * 422 insufficient_balance → показать inline-error на
                 delta.

      3. App.tsx — обернуть `/users` в inner
         `<ProtectedRoute allowedRoles={['admin']}>`.

      4. i18n:
           pages.users.title,
           pages.users.filters.status.all/active/blocked/pending,
