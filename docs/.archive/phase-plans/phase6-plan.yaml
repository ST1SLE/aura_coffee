    prompt: |
      SettingsPage UI (PDD §7.1 Phase 6 item 3, §5.2 ShopSettings).
      Потребляет GET/PUT /api/v1/admin/settings из shop-settings-
      admin-api (merge_order 3, уже merged). Включает поле
      auto_close_minutes.

      Контекст:
      - web/admin/src/pages/SettingsPage.tsx — 12-строчный stub.
      - /settings в App.tsx внутри admin+barista-обёртки. По
        RBAC — admin-only. Обернуть inner ProtectedRoute
        allowedRoles=['admin'].

      Scope:

      1. web/admin/src/api/admin-settings.ts (new):
           - getSettings() → ShopSettingsResponse
           - updateSettings(payload: ShopSettingsUpdate) →
             ShopSettingsResponse

      2. web/admin/src/pages/Settings/ (заменить SettingsPage.tsx):
           - index.tsx + SettingsPage.tsx — одна форма (react-hook-form
             + zod/yup schema-resolver или native validation — как в
             PromoFormDialog).
           - SectionCoords.tsx (.test.tsx) — shop_lat/lon, мини-карта
             опционально (если есть готовый компонент с Yandex Maps
             автокомплитом из customer-ui — НЕ переносить сюда,
             premature). Достаточно текстовых полей с numeric
             validation.
           - SectionDelivery.tsx (.test.tsx) — delivery_radius_km,
             min_delivery_amount (₽), free_delivery_threshold (₽),
             delivery_fee (₽). Поля в "₽" но внутри модели копейки:
             конвертация на входе/выходе через helper.
           - SectionLoyalty.tsx (.test.tsx) — loyalty_percent
             (slider или number input 0..100).
