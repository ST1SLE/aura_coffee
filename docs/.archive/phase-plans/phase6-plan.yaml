  - name: pickup-autoclose
    type: backend
    prompt: |
      Автозакрытие pickup-заказов через Celery Beat (PDD §7.1 Phase 6
      item 4, §6.1 READY → COMPLETED auto row).

      Контекст:
      - Таблица orders уже имеет auto_completed (bool, default false)
        и auto_completed_at (timestamptz nullable) — миграция 0005.
      - Колонка shop_settings.auto_close_minutes (int, default 60)
        добавлена в shop-settings-admin-api (merge_order 3, уже merged
        к этому моменту).
      - Сегодня services/core-api использует Celery только как клиент
        (send_task). Beat НЕ запущен; отдельного core-api worker-
        процесса нет.

      Архитектурное решение (из explore-сессии):
      - Beat: отдельный контейнер `scheduler` (celery -A core_api
        beat).
      - Worker: отдельный контейнер `core-api-worker` (celery -A
        core_api worker), использует ту же codebase что и core-api-
        HTTP. Задачи регистрируются в core_api/tasks/*.
      - Расписание захардкожено в code (beat_schedule): every 60s.
        Частоту подмены в runtime не требуется.
      - Бизнес-логика живёт в services/pickup_autoclose.py. Task —
        тонкая обёртка, чтобы тесты гоняли сервис напрямую без Celery.

      1. services/pickup_autoclose.py (новый, pure business logic):

           def close_stale_pickups(db: Session, now: datetime) -> int:
             """
             Находит pickup-заказы в READY, висящие > auto_close_minutes,
             переводит в COMPLETED с auto_completed=true, триггерит
             loyalty accrual через order_lifecycle.
             Возвращает число закрытых заказов.
             """

         Шаги (одна транзакция на каждый заказ; batch — но каждый
         заказ — своя savepoint, чтобы ошибка одного не отменяла все):

           a) settings = db.query(ShopSettings).get(1)
              cutoff = now - timedelta(minutes=settings.auto_close_minutes)
           b) stale = SELECT orders WHERE type='pickup'
                        AND status='ready'
                        AND updated_at < :cutoff
                      FOR UPDATE SKIP LOCKED
                      LIMIT 100
              SKIP LOCKED — защита от гонки если случайно запустили два
              beat'а.
           c) Для каждого заказа:
                - reuse services.order_lifecycle.transition(order,
                    OrderStatus.COMPLETED, actor='system').
                  Если order_lifecycle не принимает actor='system',
                  extend: минимальный параметр + логирование.
                  Сервис уже триггерит loyalty accrual (§6.1).
                - Установить auto_completed=true,
                  auto_completed_at=now.
                - COMMIT savepoint.
           d) Вернуть count.

         ВАЖНО: уведомления при авто-закрытии — НЕТ (§6.1 row,
         notifications column пуста). order_lifecycle может
         автоматически слать SMS для READY→COMPLETED; ПРОВЕРИТЬ и,
         если да, добавить флаг suppress_notifications=True или
         actor='system'-условие, чтобы подавить. В тестах это
         проверить.

      2. services/core-api/src/core_api/tasks/__init__.py (new) + tasks/
         pickup_autoclose.py (new):

           from core_api.celery_app import celery_app
           from core_api.database import SessionLocal  # или dep
           from core_api.services.pickup_autoclose import close_stale_pickups
           from datetime import datetime, timezone

           @celery_app.task(name="pickup.close_stale")
           def close_stale_pickups_task():
               with SessionLocal() as db:
                   return close_stale_pickups(db, datetime.now(timezone.utc))

      3. services/core-api/src/core_api/celery_app.py — добавить
         beat_schedule и import tasks:

           from celery.schedules import schedule

           celery_app = Celery(
               "core_api",
               broker=settings.redis_url,
               backend=settings.redis_url,
               include=["core_api.tasks.pickup_autoclose"],
           )
           celery_app.conf.beat_schedule = {
               "close-stale-pickups-every-60s": {
                   "task": "pickup.close_stale",
                   "schedule": 60.0,
               },
           }

      4. docker-compose.yml — ДВА новых сервиса:
           scheduler:
             image: <то же, что core-api>
             command: celery -A core_api.celery_app beat --loglevel=info
             depends_on: [redis, postgres]
             environment: <те же env что core-api>
             volumes: <те же>
           core-api-worker:
             image: <то же>
             command: celery -A core_api.celery_app worker --loglevel=info --concurrency=2
             depends_on: [redis, postgres]
             environment: <те же>
             volumes: <те же>
         Оба контейнера shared codebase с core-api.

      5. Тесты (services/core-api/tests/):
         - test_pickup_autoclose_service.py — юнит-тесты на сервис:
             * Нет pickup/READY заказов → 0, no-op.
             * Один pickup/READY с updated_at=(now - 61min),
               auto_close_minutes=60 → переведён в COMPLETED,
               auto_completed=true, auto_completed_at set.
             * Один pickup/READY с updated_at=(now - 30min) → НЕ
               тронут (под cutoff'ом).
             * Один DELIVERY/READY — НЕ тронут (только pickup).
             * Один pickup/PREPARING — НЕ тронут (только READY).
             * Loyalty accrual выставлен (транзакция ACCRUAL создана)
               как побочный эффект order_lifecycle.
             * Уведомление НЕ отправлено (celery.send_task mocked, не
               вызван с sms-task). Если в текущей реализации
               order_lifecycle шлёт SMS на COMPLETED — это bug,
               который нужно исправить (actor='system' или
               suppress flag).
             * auto_close_minutes=120: заказ висит 119min → не
               закрыт; 121min → закрыт. Параметризовать.
         - test_pickup_autoclose_task.py:
             * Регистрация Celery-таски: celery_app.tasks
               содержит "pickup.close_stale".
             * Вызов .delay()/.apply() в eager-mode дергает
               close_stale_pickups (можно мокнуть сервис).
         - test_celery_beat_schedule.py:
             * celery_app.conf.beat_schedule имеет ключ
               "close-stale-pickups-every-60s", schedule=60.

      Ограничения:
      - НЕ трогать bussines-логику order_lifecycle за пределами
        минимального actor='system'/suppress-flag, если он нужен.
      - НЕ добавлять SMS-уведомление на авто-закрытие (§6.1 row
        говорит — notifications пусты).
      - НЕ увеличивать частоту Beat (60s достаточно; меньшие интервалы
        увеличивают нагрузку без UX-выгоды — клиент всё равно не ждёт
        моментального auto-close).
      - НЕ использовать `cron` из host OS — стандартизируем на Celery
        Beat ради консистентности со стеком workers.
      - НЕ совмещать beat и worker в один контейнер (single-process
        beat+worker у Celery — anti-pattern для production; отдельные
        службы легче масштабировать и логировать).
      - НЕ регистрировать эту задачу в payment-worker/sms-worker —
        бизнес-логика живёт в core-api codebase, смешение boundaries
        запрещено (AGENTS.md §Scope для каждого воркера).

      Specs: PDD §6.1 READY → COMPLETED auto-row, §7.1 Phase 6 item 4,
      §4.5 (обновление ленты бариста ≤5s — не связано, но контекст).
