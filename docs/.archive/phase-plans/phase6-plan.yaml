            * reason='' → validation error.
            * Успех → refetch callback сработал.
            * API возвращает 422 insufficient_balance → inline error.
        - api/admin-users.test.ts: правильные URL'ы, пропагация ошибок.

      Ограничения:
      - НЕ отображать phone/phone_hash в UI (INV-013).
      - НЕ дублировать StatusBadge (OrderStatus) и UserStatusBadge —
        это разные enum'ы, разные цвета: завести отдельный
        UserStatusBadge.
      - НЕ кэшировать список агрессивно — admin может только что
        заблокировать пользователя; refetch после каждой mutation.
      - НЕ встраивать order-history пользователя в детальную модалку
