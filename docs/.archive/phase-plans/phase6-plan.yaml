              возвращает 409; кнопка "Скорректировать" скрыта).
        - BlockConfirmDialog.test.tsx:
            * Warning содержит N (active_orders_count).
            * Confirm-button disabled пока не отмечен checkbox.
            * Confirm → onConfirm() вызывается.
        - LoyaltyAdjustForm.test.tsx:
