services:
  nginx:
    ports: !override
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    environment:
      AURA_PUBLIC_DOMAIN: ${AURA_PUBLIC_DOMAIN:?AURA_PUBLIC_DOMAIN is required for TLS}
      AURA_BASIC_AUTH_REALM: ${AURA_BASIC_AUTH_REALM:-off}
      AURA_BASIC_AUTH_USER_FILE: ${AURA_BASIC_AUTH_USER_FILE:-/etc/nginx/disabled.htpasswd}
    volumes: !override
      - ${AURA_MENU_MEDIA_DIR:-./web/customer/public/media/menu}:/srv/aura-coffee/media/menu:ro
      - ${AURA_CERTBOT_WWW_DIR:-/opt/aura-coffee/certbot-www}:/var/www/certbot:ro
      - ${AURA_LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - ./deploy/nginx/nginx.production.tls.conf.template:/etc/nginx/templates/default.conf.template:ro
