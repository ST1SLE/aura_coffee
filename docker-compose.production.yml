services:
  postgres:
    env_file: !override
      - ${AURA_ENV_FILE:-.env.production}
    environment: !reset []
    ports: !reset []
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    ports: !reset []
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: unless-stopped

  db-migrate:
    build:
      target: base
    env_file: !override
      - ${AURA_ENV_FILE:-.env.production}
    volumes: !reset []

  db-seed:
    build:
      target: base
    env_file: !override
      - ${AURA_ENV_FILE:-.env.production}
    volumes: !reset []

  core-api:
    build:
      target: base
    ports: !reset []
    env_file: !override
      - ${AURA_ENV_FILE:-.env.production}
    volumes: !reset []
    command: ["uvicorn", "core_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  scheduler:
    build:
      target: base
    env_file: !override
      - ${AURA_ENV_FILE:-.env.production}
    volumes: !reset []
    restart: unless-stopped

  core-api-worker:
    build:
      target: base
    env_file: !override
      - ${AURA_ENV_FILE:-.env.production}
    volumes: !reset []
    restart: unless-stopped

  payment-worker:
    build:
      target: base
    env_file: !override
      - ${AURA_ENV_FILE:-.env.production}
    volumes: !reset []
    restart: unless-stopped

  payment-webhook:
    build:
      target: base
    ports: !reset []
    env_file: !override
      - ${AURA_ENV_FILE:-.env.production}
    volumes: !reset []
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8241/health', timeout=3).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  sms-worker:
    build:
      target: base
    env_file: !override
      - ${AURA_ENV_FILE:-.env.production}
    volumes: !reset []
    restart: unless-stopped

  web-customer:
    profiles:
      - dev-only

  web-admin:
    profiles:
      - dev-only

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    image: aura-coffee-nginx:production
    ports: !override
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes: !override
      - ${AURA_MENU_MEDIA_DIR:-./web/customer/public/media/menu}:/srv/aura-coffee/media/menu:ro
    depends_on: !override
      core-api:
        condition: service_healthy
      payment-webhook:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redisdata:
