name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - dev

concurrency:
  group: aura-coffee-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-gate:
    name: Full Verification Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        run: |
          python3 -m pip install --user uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Prepare dev environment
        run: ./scripts/setup-worktree-env.sh

      - name: Build and start stack
        run: ./scripts/up.sh --build

      - name: Run full verifier
        run: ./scripts/verify-full.sh

      - name: Capture Docker logs
        if: failure()
        run: docker compose logs --no-color > docker-compose.log

      - name: Upload Docker logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: docker-compose.log

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: ignore

      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
