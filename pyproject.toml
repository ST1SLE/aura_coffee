[tool.ruff]
target-version = "py312"
line-length = 88
src = [
    "packages/shared/src",
    "services/core-api/src",
    "services/payment-worker/src",
    "services/sms-worker/src",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["shared", "core_api", "payment_worker", "sms_worker"]
