services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aura_secret}
      POSTGRES_DB: ${POSTGRES_DB:-aura_coffee}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aura} -d ${POSTGRES_DB:-aura_coffee}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db-migrate:
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
      target: dev
    env_file: .env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPYCACHEPREFIX: "/tmp/pycache"
    volumes:
      - ./packages/shared/src:/app/packages/shared/src
      - ./services/core-api/src:/app/services/core-api/src
      - ./database:/app/database
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "cd /app/database && alembic upgrade head"]
    restart: "no"

  db-seed:
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
      target: dev
    env_file: .env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPYCACHEPREFIX: "/tmp/pycache"
    volumes:
      - ./packages/shared/src:/app/packages/shared/src
      - ./services/core-api/src:/app/services/core-api/src
      - ./database:/app/database
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "database.seeds.initial_admin"]
    restart: "no"

  core-api:
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
      target: dev
    ports:
      - "${CORE_API_PORT:-8000}:8000"
    env_file: .env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPYCACHEPREFIX: "/tmp/pycache"
    volumes:
      - ./packages/shared/src:/app/packages/shared/src
      - ./services/core-api/src:/app/services/core-api/src
      - ./services/core-api/tests:/app/services/core-api/tests
      - ./database:/app/database
    command: ["uvicorn", "core_api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-seed:
        condition: service_completed_successfully

  scheduler:
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
      target: dev
    env_file: .env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPYCACHEPREFIX: "/tmp/pycache"
    volumes:
      - ./packages/shared/src:/app/packages/shared/src
      - ./services/core-api/src:/app/services/core-api/src
      - ./services/core-api/tests:/app/services/core-api/tests
      - ./database:/app/database
    command: ["celery", "-A", "core_api.celery_app", "beat", "--loglevel=info"]
    depends_on:
      redis:
        condition: service_healthy

  core-api-worker:
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
      target: dev
    env_file: .env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPYCACHEPREFIX: "/tmp/pycache"
    volumes:
      - ./packages/shared/src:/app/packages/shared/src
      - ./services/core-api/src:/app/services/core-api/src
      - ./services/core-api/tests:/app/services/core-api/tests
      - ./database:/app/database
    command: ["celery", "-A", "core_api.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      db-seed:
        condition: service_completed_successfully

  payment-worker:
    build:
      context: .
      dockerfile: services/payment-worker/Dockerfile
      target: dev
    env_file: .env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPYCACHEPREFIX: "/tmp/pycache"
    volumes:
      - ./packages/shared/src:/app/packages/shared/src
      - ./services/payment-worker/src:/app/services/payment-worker/src
      - ./services/payment-worker/tests:/app/services/payment-worker/tests
    depends_on:
      redis:
        condition: service_healthy

  payment-webhook:
    build:
      context: .
      dockerfile: services/payment-worker/Dockerfile
      target: dev
    env_file: .env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPYCACHEPREFIX: "/tmp/pycache"
    volumes:
      - ./packages/shared/src:/app/packages/shared/src
      - ./services/payment-worker/src:/app/services/payment-worker/src
      - ./services/payment-worker/tests:/app/services/payment-worker/tests
    command: ["uvicorn", "payment_worker.webhook:app", "--host", "0.0.0.0", "--port", "8241"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  sms-worker:
    build:
      context: .
      dockerfile: services/sms-worker/Dockerfile
      target: dev
    env_file: .env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPYCACHEPREFIX: "/tmp/pycache"
    volumes:
      - ./packages/shared/src:/app/packages/shared/src
      - ./services/sms-worker/src:/app/services/sms-worker/src
      - ./services/sms-worker/tests:/app/services/sms-worker/tests
    depends_on:
      redis:
        condition: service_healthy

  web-customer:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ./web/customer:/app
      - ./web/shared-config:/shared-config:ro
      - customer_node_modules:/app/node_modules
    ports:
      - "${WEB_CUSTOMER_PORT:-5173}:5173"

  web-admin:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ./web/admin:/app
      - ./web/shared-config:/shared-config:ro
      - admin_node_modules:/app/node_modules
    ports:
      - "${WEB_ADMIN_PORT:-5174}:5174"

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-8240}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web-customer
      - web-admin
      - core-api
      - payment-webhook

volumes:
  pgdata:
  customer_node_modules:
  admin_node_modules:
