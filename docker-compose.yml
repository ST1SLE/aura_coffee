services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aura_secret}
      POSTGRES_DB: ${POSTGRES_DB:-aura_coffee}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aura} -d ${POSTGRES_DB:-aura_coffee}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  core-api:
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./packages/shared/src:/app/packages/shared/src
      - ./services/core-api/src:/app/services/core-api/src
      - ./database:/app/database
    command: ["uvicorn", "core_api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  payment-worker:
    build:
      context: .
      dockerfile: services/payment-worker/Dockerfile
    env_file: .env
    volumes:
      - ./packages/shared/src:/app/packages/shared/src
      - ./services/payment-worker/src:/app/services/payment-worker/src
    depends_on:
      redis:
        condition: service_healthy

  sms-worker:
    build:
      context: .
      dockerfile: services/sms-worker/Dockerfile
    env_file: .env
    volumes:
      - ./packages/shared/src:/app/packages/shared/src
      - ./services/sms-worker/src:/app/services/sms-worker/src
    depends_on:
      redis:
        condition: service_healthy

  web-customer:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ./web/customer:/app
      - ./web/shared-config:/shared-config:ro
      - customer_node_modules:/app/node_modules
    ports:
      - "5173:5173"

  web-admin:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ./web/admin:/app
      - ./web/shared-config:/shared-config:ro
      - admin_node_modules:/app/node_modules
    ports:
      - "5174:5174"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web-customer
      - web-admin
      - core-api

volumes:
  pgdata:
  customer_node_modules:
  admin_node_modules:
